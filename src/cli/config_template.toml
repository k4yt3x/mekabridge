# mekabridge configuration.
#
# Start mekabridge before `meka serve` where you can. meka retries a failed MCP connect in the
# background, so the wrong order recovers on its own, but until it does `[mcp].strict` makes meka
# refuse every turn.

[meka]
# Where `meka serve` is listening.
base_url = "http://127.0.0.1:8080"
# Bearer token from meka's [[serve.tokens]]. It needs the `sessions:r` and `sessions:w` scopes.
# Prefer ${ENV_VAR} or `token_file` over an inline literal.
token = "${MEKA_BRIDGE_TOKEN}"
# Longest a single turn may run before it is cancelled.
turn_timeout = "30m"

[session]
# Working directory for the agent's session. Defaults to meka's own working directory.
# cwd = "/home/you/assistant"

# "read" or "write". The send tools are read-only as far as your machine is concerned, so at "read"
# the agent can reply to messages but cannot modify files. Use "write" if you want it to actually
# change things. Do not use "ask": meka prompts for every tool call at that level, and this bridge
# cannot answer a prompt, so nothing would run at all.
permission = "read"

[bridge]
# Where operator notices go when a message cannot be delivered to the agent at all: which chats lost
# something, how many attempts were made, and the error itself. Optional, but without it the only
# detailed record is the logs.
# owner_conversation = "telegram:123456789"

# Whether the affected chat is told, in one line that says nothing but that something went wrong.
# The one place the bridge writes chat content of its own, so it can be turned off; the detail goes
# to owner_conversation either way. With both off, a message the agent never receives is reported
# only in the logs.
notify_failures = true

# Extra attempts at a batch whose turn failed, waiting 10s, then 20s, then 40s, so a message
# survives about a minute of the provider being out of quota or overloaded. Past that the chat is
# told rather than left in silence. 0 gives up after the first failure.
turn_retries = 3

# Messages that arrive during a turn are batched into the next one.
batch_max_messages = 32
max_queue_depth = 256

# How long a chat goes quiet for before its messages are handed to the agent, ON PLATFORMS THAT
# REPORT TYPING. Discord does; Telegram has no such update, so nothing there is ever held for this
# and a message starts a turn as soon as it lands. Where the signal exists the chat is held while
# somebody is still going and for this long after they stop, so the agent reads a whole thought
# rather than answering "hey" before the question arrives.
# Set to "0s" to be answered mid-sentence rather than wait.
settle = "3s"
# Ceiling on that wait, so a compose box somebody opened and walked away from cannot strand a
# message. Only reached where typing is reported, since nowhere else is a chat held this long.
settle_max = "30s"

# Messages of missed context printed alongside a mention in a muted chat. A bare "what do you think
# about that?" is meaningless on its own, and a tool call to fetch the antecedent costs a whole model
# round trip. Set to 0 to make the agent ask instead.
mute_context = 5

# What reaches the agent from a conversation nobody has ruled on, by kind of chat:
#
#   active  every message wakes the agent
#   mute    everything is recorded, but only a mention or a reply wakes the agent
#   block   nothing is delivered and nothing is kept
#
# Groups default to mentions only, which is how a person configures a busy room on their own phone.
# A one-to-one chat has nobody else in it, so mute there would silence the agent against the only
# person talking to it. The agent can override any single conversation with the mute and block tools,
# and an operator with `mekabridge policy set`.
[bridge.default_policy]
direct = "active"
group = "mute"
channel = "mute"

[mcp]
# meka connects here. Add this to meka's config.toml:
#
#   [[mcp.servers]]
#   name = "mekabridge"
#   transport = "http"
#   url = "http://127.0.0.1:9100/mcp"
#   eager_load_tools = ["send_message", "list_conversations"]
#
# Without `eager_load_tools`, meka defers MCP tools and the agent pays an extra round trip before
# every single reply.
transport = "http"
bind = "127.0.0.1:9100"
path = "/mcp"
# Required if you move `bind` off loopback. Set the same value as meka's `auth_token`.
# token = "${MEKABRIDGE_MCP_TOKEN}"

[storage]
# How long a recorded message stays readable through read_history and search_history. Set to "0s" to
# record nothing at all, which is the switch for a deployment that does not want a chat log on disk;
# delivery is unaffected either way. Matches the attachment retention, so a message and the picture
# attached to it fall out of reach together.
history_retention = "30d"

[[channels.telegram]]
id = "telegram"
# From @BotFather.
token = "${TELEGRAM_BOT_TOKEN}"
# Telegram user ids allowed to message the bot directly. A bot token is a public entry point, so
# this is mandatory and starts empty-means-nobody. Message @userinfobot to find your id. This grants
# nothing in a group: to be heard in one, add its id to `allowed_chats` below.
allowed_users = [123456789]
# Group and channel ids where every member is allowed. Group ids are negative. This is the only
# way for the bot to hear anything in a group, including from people named above.
# allowed_chats = [-1001234567890]
# Accept everyone, for a public or customer-service bot. Note that on Telegram a private chat id is
# the user's own id, so this admits individuals as well as groups: anybody who finds the bot can
# spend your provider budget. Leave the allowlists set as well to keep marking people you trust.
# allow_all = true
# Offer the agent group moderation (restrict, ban, promote, pin, set the title). On by default,
# since Telegram refuses any of it unless the bot is an admin with the matching right. Turn it off
# if the bot is an admin only so that it can read group messages.
# admin_tools = false
# Show a preview card for links the agent sends. Off by default: the agent usually cites links
# rather than making one the subject of a message, and a card on each part of a split reply is noise.
# link_preview = true
# Turn Telegram's privacy mode off (/setprivacy in @BotFather, then re-add the bot to each group).
# With it on, Telegram withholds every group message that does not mention the bot, so a muted
# conversation has nothing to record and read_history comes back empty exactly when the agent needs
# it. The `mute` policy above is the better way to limit what wakes the agent, because it keeps
# what it withholds.

# A second platform, if you want one. Every channel needs a unique id, which becomes the first
# segment of the conversation ids it produces.
# [[channels.discord]]
# id = "discord"
# # From the Bot page of the Developer Portal.
# token = "${DISCORD_BOT_TOKEN}"
# # Ids are strings, because Discord snowflakes are strings in its own API and that is what you get
# # when you copy one with Developer Mode on. At least one allowlist must be set, or `allow_all`.
# #
# # Discord user ids allowed to message the bot directly. This gates DMs, which is not optional:
# # anybody who shares a server with the bot can open one, so in a single busy server that is
# # thousands of people who would each get an agent turn for the price of a "hi". It grants nothing
# # inside a server: to be heard in a channel, name the channel, a role, or the server itself.
# allowed_users = ["245119312739729408"]
# # Servers where every member is allowed. Much the largest of the four grants: everyone in the
# # server can wake the agent by name, whether or not you have ever met them.
# # allowed_guilds = ["987654321098765432"]
# # Individual channels, including threads. A thread inherits its parent channel's standing.
# # allowed_channels = ["111222333444555666"]
# # Anyone holding one of these roles, which is the idiomatic Discord way to scope access.
# # allowed_roles = ["555666777888999000"]
# # Accept everyone. Same warning as Telegram's, and then some: on Discord this includes anybody in
# # any server the bot is in.
# # allow_all = true
# # Offer the agent moderation (timeout, kick, ban, roles, pin, slowmode). On by default, since
# # Discord refuses each call unless the bot holds the matching permission in that channel.
# # admin_tools = false
# # Ask for the privileged MESSAGE_CONTENT intent. On by default. It must be enabled first on the Bot
# # page of the Developer Portal, or the gateway closes with a 4014 at startup rather than degrading.
# # Without it Discord blanks the text of every server message except those mentioning the bot, so
# # mentions still wake the agent but read_history has nothing to show it.
# # message_content = false
# # Track who is online, for deciding who is around to be given work. Off by default: unlike the
# # other intents this one cannot be reached over HTTP, so it goes into the connection handshake, and
# # an ungranted Presence Intent closes the gateway at startup. Only the status is kept, never what
# # anyone is doing, and none of it is written to disk.
# # presence = true
# # Let a message the agent writes ping a role, or @everyone. Both off by default: the agent is
# # writing to a room it does not own, and @everyone in a large server is a loud mistake to make.
# # mention_roles = true
# # mention_everyone = true
# # Show a preview card for links the agent sends. Off by default, as on Telegram.
# # link_preview = true

[log]
level = "info"
format = "text"
